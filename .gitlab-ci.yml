workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID || $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME

default:
  interruptible: true

stages:
  - build
  - deploy

.site-changes: &site_changes
  - ".gitlab-ci.yml"
  - "requirements.txt"
  - "content/**/*"
  - "scripts/**/*"
  - "guidelines/**/*"
  - "templates/**/*"
  - "README.md"
  - "ADDING_A_LOCALE.md"

.build-documentation:
  stage: build
  image: python:latest
  script:
    - python3 -m venv .venv
    - ./.venv/bin/python -m ensurepip --upgrade
    - ./.venv/bin/python -m pip install -r requirements.txt

# Preview builds intentionally publish only a locale subset because the
# full assembled multi-locale Pages artifact is currently too large for
# MR preview deployment. If DrupalCode raises the Pages size limit for
# this project, combine preview and publish back into one full build.
build preview documentation:
  extends: .build-documentation
  rules:
    - if: $CI_MERGE_REQUEST_IID || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *site_changes
  script:
    - python3 -m venv .venv
    - ./.venv/bin/python -m ensurepip --upgrade
    - ./.venv/bin/python -m pip install -r requirements.txt
    - ./.venv/bin/python scripts/zensical/build_site.py --locales en,de
  artifacts:
    paths:
      - build/zensical/site-build/assembled
    expire_in: 1 hour

build documentation:
  extends: .build-documentation
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME
      changes: *site_changes
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
  script:
    - python3 -m venv .venv
    - ./.venv/bin/python -m ensurepip --upgrade
    - ./.venv/bin/python -m pip install -r requirements.txt
    - ./.venv/bin/python scripts/zensical/build_site.py
  artifacts:
    paths:
      - build/zensical/site-build/assembled
    expire_in: 1 hour

.pages-base:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build documentation
      optional: true
    - job: build preview documentation
      optional: true
  script:
    - echo "Documentation available at $CI_PAGES_URL"
  artifacts:
    expire_in: 1 hour

preview documentation:
  extends: .pages-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *site_changes
  needs:
    - build preview documentation
  pages:
    publish: build/zensical/site-build/assembled
    path_prefix: "preview-$CI_MERGE_REQUEST_IID"
    expire_in: 3 days

publish documentation:
  extends: .pages-base
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME
      changes: *site_changes
  needs:
    - build documentation
  pages:
    publish: build/zensical/site-build/assembled
